<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/goit-js-hw-12/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanilla App Template</title>
    <script type="module" crossorigin src="/goit-js-hw-12/index.js"></script>
    <link rel="modulepreload" crossorigin href="/goit-js-hw-12/assets/vendor-DirGshhi.js">
    <link rel="stylesheet" crossorigin href="/goit-js-hw-12/assets/vendor-CWKLx11g.css">
    <link rel="stylesheet" crossorigin href="/goit-js-hw-12/assets/index-D03KgIx9.css">
  </head>
  <body>
    <main class="app container">
      <section class="search-section">
        <form class="form js-search-form">
          <label class="form-label">
            <input
              class="form-input"
              type="text"
              name="search-text"
              placeholder="Search images..."
              autocomplete="off"
              required
            />
          </label>
          <button class="form-button" type="submit">Search</button>
        </form>
      </section>

      <section class="gallery-section">
        <ul class="gallery js-gallery"></ul>
        <button class="load-more-button js-load-more hidden" type="button">
          Load more
        </button>
        <div class="loader-container js-loader hidden" aria-hidden="true">
          <span class="loader"></span>
        </div>
      </section>
    </main>

  </body>
</html>
